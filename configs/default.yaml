# Global defaults shared by every script. Scripts load this first, then overlay the
# script-specific config passed with --config, then any --set key=value overrides.
seed: 42
claim:
  en: "Climate change and global warming is a serious concern."
  hi: "जलवायु परिवर्तन और ग्लोबल वार्मिंग एक गंभीर चिंता का विषय है।"
  bn: "জলবায়ু পরিবর্তন এবং বৈশ্বিক উষ্ণায়ন একটি গুরুতর উদ্বেগের বিষয়।"
labels: ["Favour", "Against", "None"]
languages: ["hi", "bn"]
paths:
  raw: data/raw
  processed: data/processed
  gold: data/gold
  challenge: data/challenge
  official: data/official
  cache: data/cache
  results: results
  models: models
  figures: results/figures
  experiments_csv: results/experiments.csv
device: auto          # auto | cuda | cpu
hf_cache_dir: null    # null -> default ~/.cache/huggingface
