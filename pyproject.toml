[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-climate-stance"
version = "0.1.0"
description = "Stance detection for Hindi/Bengali social-media comments on climate change"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
